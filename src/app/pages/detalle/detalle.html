@let a = alojamiento();

@if (a === null) {
  <!-- Cargando -->
  <div class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="text-muted mt-3">Cargando alojamiento...</p>
  </div>
} @else if (a) {
  <!-- Encontrado (en C23 y C24 se completa toda la información) -->
  <h1>{{ a.nombre }}</h1>
  <p class="text-muted"><i class="bi bi-geo-alt"></i> {{ a.ubicacion }}</p>
}
<!-- Si es undefined no se muestra nada: el effect() ya está llevando a la página 404 -->
