<h1 class="mb-1">Alojamientos</h1>
<p class="text-muted mb-4">
  {{ resultados().length }} {{ resultados().length === 1 ? 'alojamiento disponible' : 'alojamientos disponibles' }}
</p>

<div class="row g-4">
  <!-- Columna de filtros: a la izquierda en pantalla grande; en celular, plegada detrás del botón "Filtros" -->
  <aside class="col-lg-3">
    <!-- d-lg-none: el botón solo se ve en pantallas menores a 992 px -->
    <button class="btn btn-outline-primary w-100 d-lg-none" type="button"
            data-bs-toggle="collapse" data-bs-target="#panelFiltros"
            aria-expanded="false" aria-controls="panelFiltros">
      <i class="bi bi-funnel"></i> Filtros
    </button>

    <!-- collapse lo oculta en celular; d-lg-block lo deja siempre visible en pantalla grande -->
    <div class="collapse d-lg-block mt-3 mt-lg-0" id="panelFiltros">
      <app-filtros
        [ciudades]="ciudades()"
        [tipos]="tipos()"
        [valoresIniciales]="filtrosIniciales"
        (filtrosCambiados)="cambiarFiltros($event)"
      />
    </div>
  </aside>

  <!-- Columna de resultados -->
  <section class="col-lg-9">
    @if (resultados().length === 0) {
      <app-estado-vacio
        icono="search"
        titulo="No encontramos alojamientos con esos filtros"
        mensaje="Prueba con otra ciudad, menos huéspedes o un precio más alto."
      >
        <button type="button" class="btn btn-primary" (click)="limpiarFiltros()">
          <i class="bi bi-x-circle"></i> Limpiar filtros
        </button>
      </app-estado-vacio>
    } @else {
      <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
        @for (alojamiento of resultados(); track alojamiento.id) {
          <div class="col">
            <app-alojamiento-card [alojamiento]="alojamiento" />
          </div>
        }
      </div>
    }
  </section>
</div>
